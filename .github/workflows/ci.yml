name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip' # Cache automático de dependencias

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Correr tests unitarios
        run: pytest tests/ -v

  security:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Snyk - análisis de vulnerabilidades en dependencias
        uses: snyk/actions/python@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=requirements.txt

      - name: SonarQube Cloud - análisis de código
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=valen49
            -Dsonar.projectKey=valen49_weather-dashboard-pin
            -Dsonar.sources=app
            -Dsonar.tests=tests
            -Dsonar.exclusions=node_modules/**,e2e/**,playwright-report/**

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Obtener versión de Playwright
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cachear navegadores de Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Instalar navegadores de Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Instalar solo dependencias de sistema de Playwright
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Correr tests E2E
        run: npx playwright test --project=chromium

      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [e2e-tests, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/valen49/weather-dashboard-pin:latest
            ghcr.io/valen49/weather-dashboard-pin:${{ github.sha }}

      - name: Generar SBOM (CycloneDX)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ghcr.io/valen49/weather-dashboard-pin:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Subir artefacto SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 30

      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ghcr.io/valen49/weather-dashboard-pin:latest
            docker stop weather-dashboard || true
            docker rm weather-dashboard || true
            docker run -d --name weather-dashboard -p 5000:5000 --restart unless-stopped ghcr.io/valen49/weather-dashboard-pin:latest
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:5000/health; then
                echo "Health check OK"
                exit 0
              fi
              echo "Health check fallido, reintento $i/5..."
              sleep 5
            done
            echo "Health check fallido después de 5 reintentos"
            exit 1

      - name: Copiar stack de monitoring a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "monitoring/*"
          target: "~/monitoring"
          strip_components: 1

      - name: Desplegar stack de monitoring (Prometheus + Grafana)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD
          script: |
            cd ~/monitoring
            export GRAFANA_ADMIN_USER="$GRAFANA_ADMIN_USER"
            export GRAFANA_ADMIN_PASSWORD="$GRAFANA_ADMIN_PASSWORD"
            docker compose up -d
        env:
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
